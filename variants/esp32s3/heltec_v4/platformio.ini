; ---------------------------------------------------------------------------
; MoonHut fridge/freezer monitor on a HELTEC V4  (MVT2 candidate)
;
; Ported from the E290 build because E290s are expensive and hard to source here,
; and this one is meant to be soldered by hand and tested without risking one.
;
; ⚠ PIN CHOICE IS THE WHOLE RISK ON THIS BOARD. Three things claim pins, and only
; reading all three keeps you honest:
;   1. variant.h        - LoRa 8-14, battery 1, VEXT 36, ADC_CTRL 37, GPS 34/38-42
;   2. THE FEM          - GPIO 2, 5, 7, 46. NEVER repurpose these. Mis-driving the
;                         GC1109 is what caused the weak-TX bug fixed in Aug 2026.
;   3. THIS FILE's env  - [env:heltec-v4] takes 17/18 (I2C), 3/4 (I2C bus 1),
;                         21 (OLED reset), 35 (LED_POWER). None appear in variant.h.
;
; What is left, and what this env uses:
;   47, 48  1-Wire buses A and B   (free here; the TFT env uses them, this one does not)
;   6       buzzer                 (the TFT env also uses 6 for a buzzer)
;   33      external button
;   15, 16  status LEDs            ⚠ these are XTAL_32K_P/N on the S3. No 32 kHz crystal
;                                    is declared for this board, but VERIFY on your unit
;                                    before soldering - a fitted crystal would make them
;                                    unusable and the failure would look like a dead LED.
;
; NOTE the E290 pin numbers do NOT carry over: its button/LEDs were on 38-40 and 42,
; which are GPS pins here.
;
; The OLED is 128x64 against the E290's 296x128 e-ink. The fridge frames were laid out
; for e-ink and will be cramped; with 8 probes the overview will not fit. The mesh
; reporting is the point of this build, not the panel.
[env:heltec-v4-fridge]
extends = env:heltec-v4
board_build.partitions = default_16MB.csv
build_flags =
  ${env:heltec-v4.build_flags}
  -D MOONHUT_FRIDGE                    ; DS18B20 probes + local threshold alarm
  -D MOONHUT_FRIDGE_ONLY               ; strip the Meshtastic carousel to fridge frames
  -D MOONHUT_NO_LOW_VOLTAGE_SHUTDOWN   ; mains appliance: no cell to protect, and the
                                       ; check misfires on this board family (see Power.cpp)
  -D MOONHUT_ONEWIRE_PIN=47            ; 1-Wire bus A
  -D MOONHUT_ONEWIRE_PIN2=48           ; 1-Wire bus B - two short buses beat one long one
  -D PIN_BUZZER=6                      ; passive piezo. NOT a probe bus: tone() on a 1-Wire
                                       ; line corrupts every read while the alarm sounds
  -D MOONHUT_EXT_BUTTON_PIN=33         ; to GND, internal pull-up, no resistor. POLLED,
                                       ; never an ISR - an ISR on an unwired pin wedged a node
  -D MOONHUT_LED_GREEN_PIN=15          ; anode -> 330R -> pin, cathode -> GND
  -D MOONHUT_LED_RED_PIN=16
  -D MOONHUT_FRIDGE_MAX_PROBES=16
  -D MOONHUT_FRIDGE_HIGH_C=8.0f
  -D MOONHUT_FRIDGE_LOW_C=-40.0f
  -D MOONHUT_FRIDGE_DWELL_S=900
  -D MOONHUT_FRIDGE_HYSTERESIS_C=1.5f
  -D MOONHUT_FRIDGE_POLL_S=5
lib_deps =
  ${env:heltec-v4.lib_deps}
  ; PATCHED OneWire - upstream 2.3.8 cannot drive any GPIO above 33 on an ESP32-S3, so
  ; reset() reports "no presence pulse" on pin 47 without ever touching the bus. This cost
  ; three probe batches before anyone suspected the library. See lib_moonhut/README.md.
  symlink://lib_moonhut/OneWire
  milesburton/DallasTemperature@^3.11.0
upload_speed = 115200
