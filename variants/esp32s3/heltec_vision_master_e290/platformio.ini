; Using the original screen class
[env:heltec-vision-master-e290]
custom_meshtastic_hw_model = 68
custom_meshtastic_hw_model_slug = HELTEC_VISION_MASTER_E290
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Vision Master E290
custom_meshtastic_images = heltec-vision-master-e290.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
custom_meshtastic_has_ink_hud = true

extends = esp32s3_base
board = heltec_vision_master_e290
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags} 
  -I variants/esp32s3/heltec_vision_master_e290
  -D DISPLAY_FLIP_SCREEN ; Orient so the LoRa antenna faces up
  -D HELTEC_VISION_MASTER_E290
  -D MOONHUT_SIGN                        ; MoonHut: custom MoonPaper fullscreen sign frame
  -D OLED_RU                             ; MoonHut: Cyrillic fonts + UTF-8 mapping for the sign
  -D BUTTON_CLICK_MS=200
  -D EINK_DISPLAY_MODEL=GxEPD2_290_BN8
  -D EINK_WIDTH=296
  -D EINK_HEIGHT=128
  -D USE_EINK
  -D USE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -D EINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted
  -D EINK_HASQUIRK_GHOSTING             ; Display model is identified as "prone to ghosting"


lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
upload_speed = 115200

; MoonHut fridge monitor (MVT1) - a DEDICATED APPLIANCE, not a sign with a probe.
;
; This env deliberately does NOT extend env:heltec-vision-master-e290, because that
; one defines MOONHUT_SIGN and PlatformIO cannot subtract a flag once inherited. The
; sign is actively harmful here: its frame hijacks the stock text-message frame, and
; its PRG page-flip swallows the button press, so once the carousel reached the sign
; there was no way back to the fridge frame short of a reboot.
;
; Dropping MOONHUT_SIGN does NOT break meshhub's escalation: the bell-character buzz
; is stock ExternalNotificationModule, which has no dependency on the sign.
;
; OLED_RU is kept even with no messages - it selects the wider glyph set that carries
; the degree sign the temperature readout uses.
;
; Wiring: devices/vision-master-e290/WIRING-fridge.md
[env:heltec-vision-master-e290-fridge]
extends = esp32s3_base
board = heltec_vision_master_e290
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec_vision_master_e290
  -D DISPLAY_FLIP_SCREEN                 ; Orient so the LoRa antenna faces up
  -D HELTEC_VISION_MASTER_E290
  -D OLED_RU                             ; wider glyph set - carries the degree sign
  -D BUTTON_CLICK_MS=200
  -D EINK_DISPLAY_MODEL=GxEPD2_290_BN8
  -D EINK_WIDTH=296
  -D EINK_HEIGHT=128
  -D USE_EINK
  -D USE_EINK_DYNAMICDISPLAY
  -D EINK_LIMIT_FASTREFRESH=10           ; every 11th repaint is a full-refresh flash
  -D EINK_HASQUIRK_GHOSTING
  -D MOONHUT_FRIDGE                      ; DS18B20 probes + local threshold alarm
  -D MOONHUT_FRIDGE_ONLY
  -D MOONHUT_NO_LOW_VOLTAGE_SHUTDOWN   ; mains appliance: no cell to protect, and the
                                       ; check misfires on this board (see Power.cpp)                 ; strip the Meshtastic carousel to fridge frames only
  -D MOONHUT_ONEWIRE_PIN=47              ; 1-Wire bus A
  -D MOONHUT_ONEWIRE_PIN2=48             ; 1-Wire bus B - two short buses beat one long one
  -D PIN_BUZZER=42                       ; NOT 48: that is now a probe bus, and tone() on a
                                         ; 1-Wire line corrupts every read while the alarm sounds
  ; Panel-mounted controls, for once the board is boxed and PRG/RST are unreachable.
  ; 17 is deliberately unused: it is I2C_SDA and reads HIGH even when driven LOW.
  ; Panel controls. 15/16 were WRONG - unused by firmware but not broken out on this
  ; board at all. These three are on the header and free (absent from variant.h).
  ; The button is POLLED, never interrupt-driven: an ISR on an unwired pin wedged the
  ; node hard enough to need a manual bootloader entry.
  -D MOONHUT_EXT_BUTTON_PIN=40           ; to GND, internal pull-up, no resistor
  -D MOONHUT_LED_GREEN_PIN=39            ; via ~330R to GND
  -D MOONHUT_LED_RED_PIN=38              ; via ~330R to GND
  -D MOONHUT_FRIDGE_MAX_PROBES=16        ; array size only - see WIRING-fridge.md for the real bus limits
  ; Per-probe DEFAULTS. Every one of these is overridable per probe at runtime and
  ; persisted by ROM - a freezer and a fridge cannot share one threshold.
  -D MOONHUT_FRIDGE_HIGH_C=8.0f
  -D MOONHUT_FRIDGE_LOW_C=-40.0f         ; effectively off until set per probe
  -D MOONHUT_FRIDGE_DWELL_S=900
  -D MOONHUT_FRIDGE_HYSTERESIS_C=1.5f
  -D MOONHUT_FRIDGE_POLL_S=5             ; mains powered: sampling is free, conversions are parallel
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
  ; PATCHED OneWire: upstream 2.3.8 cannot drive any GPIO above 33 on an ESP32-S3,
  ; so reset() reports 'no presence pulse' on pin 47 without touching the bus.
  ; See lib_moonhut/README.md. Scoped to this env - lib/ would hit every board.
  symlink://lib_moonhut/OneWire
  milesburton/DallasTemperature@^3.11.0
upload_speed = 115200

; MoonHut tank level (PROOF OF CONCEPT) - HC-SR04P ultrasonic ranger on a SPARE E290.
;
; Deliberately its own env and NOT the fridge build: that one boots looking for DS18B20
; probes and would sit there reporting "no probe".
;
; The HC-SR04P is the 3.3 V variant (3.2-5.5 V) - no level shifting, no divider. A plain
; HC-SR04 outputs 5 V on ECHO and would need a divider; the ESP32-S3 is not 5 V tolerant.
;
; Open question this build exists to answer: can an HC-SR04 reach the bottom of a 3 m tank?
; Nominal range is 4 m; usable range on a weak return is nearer 2-3 m, and it degrades when
; the tank is nearly empty - which is when the reading matters most. Bench-test the range
; against a wall BEFORE any tank work.
[env:heltec-vision-master-e290-tank]
extends = esp32s3_base
board = heltec_vision_master_e290
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec_vision_master_e290
  -D DISPLAY_FLIP_SCREEN
  -D HELTEC_VISION_MASTER_E290
  -D OLED_RU
  -D BUTTON_CLICK_MS=200
  -D EINK_DISPLAY_MODEL=GxEPD2_290_BN8
  -D EINK_WIDTH=296
  -D EINK_HEIGHT=128
  -D USE_EINK
  -D USE_EINK_DYNAMICDISPLAY
  -D EINK_LIMIT_FASTREFRESH=10
  -D EINK_HASQUIRK_GHOSTING
  -D MOONHUT_TANK
  -D MOONHUT_TANK_ONLY
  -D MOONHUT_NO_LOW_VOLTAGE_SHUTDOWN   ; mains appliance: no cell to protect, and the
                                       ; check misfires on this board (see Power.cpp)
  ; NOT 17/16: the on-board diagnostic caught GPIO 17 reading HIGH while driven LOW
  ; (it is I2C_SDA on this chip family and something is pulling it up), so the trigger
  ; pulse never reached the sensor. 41/40 both tested genuinely floating.
  -D MOONHUT_TANK_TRIG_PIN=41
  -D MOONHUT_TANK_ECHO_PIN=40
  -D MOONHUT_TANK_POLL_S=2
  -D MOONHUT_TANK_SAMPLES=5
  ; Reporting cadence. Polling stays fast so the PANEL is live; the MESH is not.
  ; As shipped this broadcast on any 2 cm change with no floor under it, and the sensor
  ; wanders more than that standing still: 140 msgs/hour, median gap 15s. A tank does not
  ; change that fast, and the flood is the prime suspect for the RF that killed the
  ; gateway's USB port on 2026-08-27.
  -D MOONHUT_TANK_NEVER_SLEEP            ; mains installation - the panel must never blank.
                                         ; Declared, not inferred: PowerStatus is tri-state and
                                         ; an UNKNOWN USB reading is indistinguishable from "no USB"
  -D MOONHUT_TANK_REPORT_S=600           ; heartbeat, 10 min
  -D MOONHUT_TANK_MIN_REPORT_S=120       ; hard floor between ANY two reports
  -D MOONHUT_TANK_REPORT_DELTA_M=0.05f   ; 5 cm, above the sensor's own noise
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
upload_speed = 115200

[env:heltec-vision-master-e290-inkhud]
extends = esp32s3_base, inkhud
board = heltec_vision_master_e290
board_build.partitions = default_8MB.csv
build_src_filter = 
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}
build_flags = 
  ${esp32s3_base.build_flags}
  ${inkhud.build_flags}
  -I variants/esp32s3/heltec_vision_master_e290
  -D HELTEC_VISION_MASTER_E290
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${esp32s3_base.lib_deps}
upload_speed = 921600
